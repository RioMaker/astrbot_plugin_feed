[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".preview", "pytest-of-hr", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
